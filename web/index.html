<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muvim</title>
<link rel="icon" href="muvim.ico" sizes="any">
<link rel="icon" href="muvim.png" type="image/png">
<link rel="apple-touch-icon" href="muvim.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topin">
      <a class="logo" href="#radar" aria-label="Muvim, início"><span>MUVIM</span></a>
      <div class="today" id="today"></div>
      <form class="search" id="busca" role="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Buscar filme, série ou pessoa" aria-label="Buscar" autocomplete="off">
      </form>
      <button class="bell" id="sino" aria-label="Alertas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><b id="sino-n" hidden></b></button>
    </div>
    <nav class="tabs" id="abas">
      <a href="#radar">Radar</a>
      <a href="#series">Séries</a>
      <a href="#pessoas">Pessoas</a>
      <a href="#mudou">O que mudou</a>
      <a href="#ligacoes">Ligações</a>
      <a href="#lista">Minha lista</a>
    </nav>
  </div>
</header>
<main class="wrap" id="tela" aria-live="polite"></main>
<footer class="wrap rodape" id="rodape"></footer>
<div class="drawer" id="gaveta" hidden><div class="shade" id="sombra"></div><aside class="panel" id="painel" role="dialog" aria-modal="true"></aside></div>
<script src="app.js"></script>
</body>
</html>
